<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean-deep: #0f3568;
    --ocean-mid: #1c5aa0;
    --ocean-pale: #dce9f7;
    --land: #4f8f39;
    --land-pale: #e9f4df;
    --ridge: #d8362a;
    --transform: #c07800;
    --subduction: #0d255c;
    --bg: #eef3f9;
    --surface: #ffffff;
    --surface-2: #e7eef8;
    --text: #101d31;
    --text-dim: #4c607f;
    --text-dim: #4d6480;
    --border: #d4e0ee;
    --accent: var(--ocean-mid);
    --focus: #1c5aa0;
    --shadow: 220 45% 30%;

    --font-display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

    --transition-fast: 180ms;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ocean-deep: #1a4d8f;
      --ocean-mid: #4d8fd6;
      --ocean-pale: #16283f;
      --land: #7fc25c;
      --land-pale: #16281c;
      --ridge: #ff6b5c;
      --transform: #ffb238;
      --subduction: #7fa3e0;
      --bg: #0a1524;
      --surface: #101f36;
      --surface-2: #16283f;
      --text: #e9eff8;
      --text-dim: #92a7c4;
      --border: #23384f;
      --accent: var(--ocean-mid);
      --focus: #6cb2ff;
      --shadow: 220 60% 3%;
    }
  }
  :root[data-theme="dark"] {
    --ocean-deep: #1a4d8f;
    --ocean-mid: #4d8fd6;
    --ocean-pale: #16283f;
    --land: #7fc25c;
    --land-pale: #16281c;
    --ridge: #ff6b5c;
    --transform: #ffb238;
    --subduction: #7fa3e0;
    --bg: #0a1524;
    --surface: #101f36;
    --surface-2: #16283f;
    --text: #e9eff8;
    --text-dim: #92a7c4;
    --border: #23384f;
    --accent: var(--ocean-mid);
    --focus: #6cb2ff;
    --shadow: 220 60% 3%;
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --transition-fast: 0ms; }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ocean-mid); }
  a:not(:hover) { text-decoration-thickness: 1px; }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .page {
    max-width: 1180px;
    margin-inline: auto;
    padding: clamp(1.25rem, 4vw, 3rem) clamp(1.1rem, 4vw, 2rem) 4rem;
    display: flex;
    flex-direction: column;
    gap: clamp(1.75rem, 4vw, 2.75rem);
  }

  /* ---------- Header ---------- */

  .mission-header {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .mission-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.65rem;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .mission-chip {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ocean-deep);
    background: var(--ocean-pale);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.22rem 0.55rem;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mission-chip { color: var(--ocean-mid); } }
  :root[data-theme="dark"] .mission-chip { color: var(--ocean-mid); }

  h1.mission-title {
    font-size: clamp(2.1rem, 5vw, 3.1rem);
    font-weight: 700;
    font-optical-sizing: auto;
  }

  .mission-tagline {
    font-style: italic;
    font-size: 1.15rem;
    color: var(--text-dim);
    max-width: 46ch;
  }

  .mission-brief {
    max-width: 68ch;
    color: var(--text);
  }
  .mission-brief p { margin: 0 0 0.9em; }
  .mission-brief p:last-child { margin-bottom: 0; }

  /* ---------- Console ---------- */

  .console {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: clamp(1rem, 3vw, 1.6rem);
    box-shadow: 0 1px 2px hsl(var(--shadow) / 0.06), 0 12px 32px -16px hsl(var(--shadow) / 0.28);
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .view-toggle {
    display: inline-flex;
    align-self: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem;
    gap: 0.2rem;
  }

  .view-toggle button {
    font-family: var(--font-body);
    font-size: 0.92rem;
    font-weight: 700;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 0.5rem 1.05rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
  }

  .view-toggle button[aria-pressed="true"] {
    background: var(--ocean-mid);
    color: #fff;
  }

  .view-toggle button:not([aria-pressed="true"]):hover {
    color: var(--text);
  }

  .map-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1300 / 715;
    border-radius: 14px;
    overflow: hidden;
    background: var(--ocean-deep);
    border: 1px solid var(--border);
  }

  .map-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity var(--transition-fast) ease;
  }

  .map-frame img.is-visible {
    opacity: 1;
  }

  .map-caption {
    position: absolute;
    z-index: 2;
    left: 0.85rem;
    top: 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 600;
    color: #eef4fc;
    background: rgb(10 20 35 / 0.55);
    padding: 0.3rem 0.6rem;
    border-radius: 7px;
    backdrop-filter: blur(2px);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.3rem;
    font-size: 0.86rem;
    color: var(--text-dim);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
  }

  .legend-swatch {
    display: inline-block;
    width: 1.15rem;
    height: 3px;
    border-radius: 2px;
    flex: none;
  }
  .legend-swatch.ridge { background: var(--ridge); }
  .legend-swatch.transform { background: var(--transform); }
  .legend-swatch.subduction { background: var(--subduction); height: 4px; }
  .legend[hidden] { display: none; }

  /* ---------- Slider ---------- */

  .time-control {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .time-readout-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .time-readout {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    color: var(--ocean-deep);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .time-readout { color: var(--ocean-mid); } }
  :root[data-theme="dark"] .time-readout { color: var(--ocean-mid); }

  .time-readout-long {
    font-family: var(--font-mono);
    font-size: 0.86rem;
    color: var(--text-dim);
  }

  .slider-track-wrap {
    position: relative;
    padding: 0.4rem 0 1.4rem;
  }

  input[type="range"].time-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--ocean-deep), var(--ocean-mid));
    outline-offset: 4px;
    cursor: pointer;
    margin: 0;
  }

  input[type="range"].time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--surface);
    border: 4px solid var(--ocean-mid);
    box-shadow: 0 2px 6px hsl(var(--shadow) / 0.35);
    cursor: pointer;
    margin-top: 0;
  }

  input[type="range"].time-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--surface);
    border: 4px solid var(--ocean-mid);
    box-shadow: 0 2px 6px hsl(var(--shadow) / 0.35);
    cursor: pointer;
  }

  .tick-row {
    position: absolute;
    left: 0;
    right: 0;
    top: 1.6rem;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }

  .tick {
    width: 2px;
    height: 6px;
    background: var(--border);
    border-radius: 1px;
  }

  .slider-endpoints {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: -0.6rem;
  }

  /* ---------- Field log ---------- */

  .field-log {
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
  }

  .log-entry {
    max-width: 68ch;
  }

  .log-entry h2 {
    font-size: 1.35rem;
    margin-bottom: 0.55rem;
  }

  .log-entry p { margin: 0 0 0.85em; }
  .log-entry p:last-child { margin-bottom: 0; }

  .log-entry ul {
    margin: 0.6em 0 0;
    padding-left: 1.25em;
    display: flex;
    flex-direction: column;
    gap: 0.5em;
  }

  .prompts {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.15rem 1.3rem;
  }
  .prompts h2 { font-size: 1.2rem; margin-bottom: 0.7rem; }
  .prompts ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.65rem; }
  .prompts li {
    padding-left: 1.6em;
    position: relative;
  }
  .prompts li::before {
    content: "?";
    position: absolute;
    left: 0;
    top: 0.05em;
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--ocean-mid);
  }

  /* ---------- Footer ---------- */

  footer {
    border-top: 1px solid var(--border);
    padding-top: 1.3rem;
    font-size: 0.86rem;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  footer strong { color: var(--text); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
</style>
